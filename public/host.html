<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테크킹 운동회 · 선생님 화면</title>
<link rel="icon" href="techking.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="wrap hero">
  <img src="techking.png" alt="테크킹">
  <h1>선생님<br><span>진행 화면</span></h1>
  <p>서버 창에 나온 4자리 PIN을 입력하세요</p>
  <form id="pinForm" class="box">
    <input id="pinInput" class="field-input" inputmode="numeric" maxlength="8" placeholder="PIN" aria-label="선생님 PIN" required>
    <button class="btn" type="submit">들어가기</button>
    <p class="error" id="pinError" role="alert"></p>
  </form>
</section>
<main id="dash" class="host-wrap" hidden></main>
<script src="common.js"></script>
<script src="games.js"></script>
<script src="host.js"></script>
</body>
</html>
